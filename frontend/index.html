<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png?v=3" />
    <link rel="apple-touch-icon" href="/favicon.png?v=3" />
    <meta name="theme-color" content="#16181d" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FuturaTecno - Venta de Tecnología</title>
    <!-- Tipografías de la landing (home) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
    <!-- Sign in with Google (Google Identity Services). Solo se usa si hay GOOGLE_CLIENT_ID configurado. -->
    <script src="https://accounts.google.com/gsi/client" async></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <!-- Chat de atención con IA (Forja). Solo responde en futuratecno.com.ar.
         El tema y el color siguen la paleta del sitio (#c8e048 sobre #16181d). -->
    <script src="https://forja-starter-18b9c9.claudiocarmu.workers.dev/widget.js"
            data-tema="oscuro"
            data-color="#c8e048"
            data-saludo="¡Hola! ¿Qué estás buscando? Contame y te oriento."></script>
    <script>
      // Safari/iOS hace zoom al enfocar controles con letra menor a 16px. El
      // widget vive dentro de un Shadow DOM abierto, por eso este ajuste queda
      // limitado al chat y no deshabilita el zoom ni afecta la accesibilidad
      // del resto del sitio.
      (function () {
        function ajustarChatMovil() {
          const widget = document.querySelector('[data-forja-widget]')
          const raiz = widget?.shadowRoot
          if (!raiz || raiz.querySelector('[data-futuratecno-chat-mobile]')) return

          const estilo = document.createElement('style')
          estilo.setAttribute('data-futuratecno-chat-mobile', '')
          estilo.textContent = `
            @media (max-width: 600px) {
              .pie { min-width: 0; }
              .pie textarea { min-width: 0; font-size: 16px !important; }
              .pie .enviar { flex: 0 0 50px; width: 50px; padding: 0; }
            }
          `
          raiz.appendChild(estilo)
        }

        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', ajustarChatMovil)
        } else {
          ajustarChatMovil()
        }
      })()
    </script>
  </body>
</html>
