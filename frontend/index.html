<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png?v=5" />
    <link rel="apple-touch-icon" href="/favicon.png?v=5" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- seo: el backend (SeoController) reemplaza este bloque en las páginas de producto -->
    <title>Tecnópolis Olavarría — Tecnología en Olavarría | Celulares, notebooks y PC</title>
    <meta name="description" content="Tecnópolis Olavarría: tienda de tecnología en Olavarría. iPhone, celulares, notebooks, componentes de PC y consolas, con envío a todo el país y retiro en San Martín 2821." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Tecnópolis Olavarría" />
    <meta property="og:title" content="Tecnópolis Olavarría — Tecnología en Olavarría" />
    <meta property="og:description" content="iPhone, celulares, notebooks, componentes de PC y consolas. Envío a todo el país y retiro en Olavarría." />
    <meta property="og:image" content="https://www.tecnopolisolavarria.com/og-image.png" />
    <meta property="og:locale" content="es_AR" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- /seo -->
    <!-- Tipografía (Fontshare): Amulya en todo el sitio, 400 para textos y 700 para títulos y botones. Se cargan desde
         la API de Fontshare y NO se copian al repo: el repo es público y la licencia (FFL) no permite
         dejar los archivos en un repositorio accesible a terceros. -->
    <link rel="preconnect" href="https://api.fontshare.com" crossorigin />
    <link href="https://api.fontshare.com/v2/css?f[]=amulya@400,700&display=swap" rel="stylesheet" />
    <!-- Sign in with Google (Google Identity Services). Solo se usa si hay GOOGLE_CLIENT_ID configurado. -->
    <script src="https://accounts.google.com/gsi/client" async></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <!-- Chat de atención con IA (Forja). Solo responde en futuratecno.com.ar.
         Burbuja en verde WhatsApp (#25D366, pedido del usuario) y tema claro.
         "Tecnito" es el nombre del asistente: el mismo bot atiende WhatsApp, y ahí se presenta igual
         porque el nombre vive en su configuración de Forja (setting bot_name). -->
    <script src="https://forja-starter-18b9c9.claudiocarmu.workers.dev/widget.js"
            data-nombre="Tecnito"
            data-tema="claro"
            data-color="#25D366"
            data-saludo="¡Hola! ¿Qué estás buscando? Contame y te oriento."></script>
    <script>
      // Safari/iOS hace zoom al enfocar controles con letra menor a 16px. El
      // widget vive dentro de un Shadow DOM abierto, por eso este ajuste queda
      // limitado al chat y no deshabilita el zoom ni afecta la accesibilidad
      // del resto del sitio.
      (function () {
        function ajustarChatMovil() {
          const widget = document.querySelector('[data-forja-widget]')
          const raiz = widget?.shadowRoot
          if (!raiz || raiz.querySelector('[data-futuratecno-chat-mobile]')) return

          const estilo = document.createElement('style')
          estilo.setAttribute('data-futuratecno-chat-mobile', '')
          estilo.textContent = `
            @media (max-width: 600px) {
              .pie { min-width: 0; }
              .pie textarea { min-width: 0; font-size: 16px !important; }
              .pie .enviar { flex: 0 0 50px; width: 50px; padding: 0; }
            }
          `
          raiz.appendChild(estilo)
        }

        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', ajustarChatMovil)
        } else {
          ajustarChatMovil()
        }
      })()
    </script>
    <!-- Tecnito: la mascota que se sienta sobre la burbuja del chat (public/tecnito.js). -->
    <script src="/tecnito.js?v=2" defer></script>
  </body>
</html>
